name: publish

on:
  workflow_dispatch:

  push:
    tags:
      - v*

jobs:
  publish:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Write GPG Secret Key
        run: echo "${{ secrets.OSSRH_GPG_SECRET_FILE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/secring.gpg"

      - run: chmod 777 ./gradlew

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          "ORG_GRADLE_PROJECT_signing.keyId": ${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}
          "ORG_GRADLE_PROJECT_signing.password": ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          "ORG_GRADLE_PROJECT_signing.secretKeyRingFile": ${{ github.workspace }}/secring.gpg
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

      - uses: actions/create-release@v1
        if: ${{ github.ref_type == 'tag' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body_path: ./CHANGELOG.md
